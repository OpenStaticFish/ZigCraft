name: OpenCode V2 private inference
description: One tool-free Responses request on an ephemeral hosted Linux runner
inputs:
  profile:
    description: Reviewed profile name
    required: true
  base-url:
    description: Protected environment HTTPS MagicDNS endpoint ending in /v1
    required: true
  client-key:
    description: Dedicated CLIProxyAPI credential
    required: true
  oauth-client-id:
    description: Dedicated Tailscale OAuth client ID
    required: true
  oauth-secret:
    description: Tag-scoped Tailscale OAuth secret
    required: true
runs:
  using: composite
  steps:
    - name: Validate request and install pinned CLI before joining
      id: install
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        BASE_URL: ${{ inputs.base-url }}
        HAS_OAUTH: ${{ inputs.oauth-client-id != '' && inputs.oauth-secret != '' }}
        HAS_PROXY_KEY: ${{ inputs.client-key != '' }}
      run: |
        set -euo pipefail
        [[ "$HAS_OAUTH" == true ]] || { echo "::error::Missing protected Tailscale identity"; exit 1; }
        [[ "$HAS_PROXY_KEY" == true ]] || { echo "::error::Missing protected proxy client key"; exit 1; }
        python3 "$GITHUB_ACTION_PATH/adapter.py" prepare
        archive="$RUNNER_TEMP/opencode-v2.tar.gz"
        curl --fail --silent --show-error --location --proto '=https' --max-time 120 \
          https://github.com/anomalyco/opencode/releases/download/v2.3.0/opencode-linux-x64.tar.gz -o "$archive"
        echo "fc0f81522aceeabac47693d88389efa2bc517ce74c2c38fd6967819fcc6e4d3b  $archive" | sha256sum --check --status
        tar -xzf "$archive" -C "$RUNNER_TEMP" opencode
    - name: Join ephemeral tailnet node
      id: join
      uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
      with:
        oauth-client-id: ${{ inputs.oauth-client-id }}
        oauth-secret: ${{ inputs.oauth-secret }}
        tags: tag:zigcraft-opencode
        version: 1.104.4
        sha256sum: 624ea093d47d62cf56f17b8332d74b8decda4a1faa610ebc60a1de334b2b3dc9
        args: --accept-routes=false --shields-up
        hostname: zigcraft-${{ github.run_id }}-${{ github.run_attempt }}
        retry: '1'
        timeout: 60s
        use-cache: 'false'
        log-mode: quiet
    - name: Verify proxy peer, route and TLS
      id: tls
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
      run: python3 "$GITHUB_ACTION_PATH/adapter.py" connect
    - name: Run standalone OpenCode
      id: model
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        BASE_URL: ${{ inputs.base-url }}
        ZIGCRAFT_PROXY_KEY: ${{ inputs.client-key }}
      run: python3 "$GITHUB_ACTION_PATH/adapter.py" infer
    - name: Disconnect before returning any output
      id: disconnect
      if: always() && steps.join.outcome == 'success'
      shell: bash
      run: timeout 15 sudo -n tailscale logout >/dev/null 2>&1
    - name: Record adapter stages
      if: always()
      shell: bash
      run: |
        jq -r '"Requested gateway model: `\(.model)` · reasoning effort: `\(.reasoning_effort)`"' \
          "$GITHUB_ACTION_PATH/model.json" >> "$GITHUB_STEP_SUMMARY"
        echo 'Install/input: ${{ steps.install.outcome }} · Join: ${{ steps.join.outcome }} · Peer/TLS: ${{ steps.tls.outcome }} · Model: ${{ steps.model.outcome }} · Disconnect: ${{ steps.disconnect.outcome }}' >> "$GITHUB_STEP_SUMMARY"
