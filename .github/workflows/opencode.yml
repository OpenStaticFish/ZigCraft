name: opencode
on:
  issue_comment:
    types: [created]

permissions: {}
concurrency:
  group: opencode-slash-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  slash:
    cache-mode: none
    if: >-
      vars.OPENCODE_V2_SLASH_ENABLED == 'true' &&
      github.repository == 'OpenStaticFish/ZigCraft' &&
      github.event.repository.default_branch == 'dev' && github.ref == 'refs/heads/dev' &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/opencode-v2-infer.yml
    secrets:
      OPENCODE_PAT: ${{ secrets.OPENCODE_PAT }}
      OPENCODE_PROXY_BASE_URL: ${{ secrets.OPENCODE_PROXY_BASE_URL }}
      OPENCODE_PROXY_KEY: ${{ secrets.OPENCODE_PROXY_KEY }}
    with:
      task: slash
