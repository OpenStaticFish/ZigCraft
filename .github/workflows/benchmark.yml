name: Benchmark

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  schedule:
    - cron: "17 3 * * 3"
  workflow_dispatch:
    inputs:
      duration:
        description: Benchmark duration per preset (seconds)
        required: false
        default: "60"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  BENCHER_ENABLED: ${{ secrets.BENCHER_API_TOKEN != '' && secrets.BENCHER_PROJECT != '' }}
  BENCHER_PROJECT: ${{ secrets.BENCHER_PROJECT }}
  BENCHER_DASHBOARD_URL: ${{ vars.BENCHER_DASHBOARD_URL }}

jobs:
  benchmark:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Long scheduled/manual acceptance captures remain externally bounded.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check benchmark trigger gate
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('run', 'true');
              return;
            }

            const labels = context.payload.pull_request.labels.map((label) => label.name);
            if (labels.includes('run-benchmark')) {
              core.setOutput('run', 'true');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const shouldRun = files.some((file) => {
              const name = file.filename;
              return name === 'build.zig' || name.startsWith('src/') || name.startsWith('modules/') || name.startsWith('assets/shaders/') || name.startsWith('scripts/') || name.startsWith('docs/benchmarks/') || name === '.github/workflows/benchmark.yml';
            });
            core.setOutput('run', shouldRun ? 'true' : 'false');

      - name: Explain skipped benchmark
        if: steps.gate.outputs.run != 'true'
        run: |
          printf 'Skipping benchmark: no benchmark-relevant paths changed and run-benchmark label is absent.\n'

      - name: Setup devenv
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup-devenv

      - name: Setup Zig cache
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup-zig-cache
        with:
          cache-key-prefix: zig-ci-graphics

      - name: Start headless Wayland compositor
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/start-weston

      - name: Setup Lavapipe Vulkan
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup-lavapipe

      - name: Run benchmark suite
        if: steps.gate.outputs.run == 'true'
        id: run_benchmark
        uses: ./.github/actions/run-with-log
        with:
          name: Benchmark
          timeout: ${{ github.event_name == 'schedule' && '55m' || github.event_name == 'workflow_dispatch' && '55m' || '20m' }}
          log-file: benchmark.log
          command: mkdir -p "$MESA_SHADER_CACHE_DIR" && devenv shell --profile graphics -- bash scripts/run_benchmark.sh --duration "$BENCHMARK_DURATION" --presets low,medium,high --scenarios stationary,traversal,rapid-turn,teleport-eviction --benchmark-world overworld --output-dir benchmark-results --per-preset-timeout 600
        env:
          XDG_RUNTIME_DIR: /tmp/runtime-runner
          WAYLAND_DISPLAY: headless
          MESA_SHADER_CACHE_DIR: /tmp/mesa_shader_cache
          SDL_AUDIODRIVER: dummy
          ZIGCRAFT_SAFE_MODE: "1"
          # PR/push runs are bounded canaries. Scheduled and manually requested
          # captures are longer acceptance evidence, not synthetic fixtures.
          BENCHMARK_DURATION: ${{ github.event_name == 'schedule' && '60' || github.event_name == 'workflow_dispatch' && github.event.inputs.duration || '5' }}

      - name: Validate benchmark results
        id: validate_results
        if: steps.gate.outputs.run == 'true'
        run: |
          for preset in low medium high; do
            for scenario in stationary traversal rapid-turn teleport-eviction; do
              bash scripts/validate_benchmark_artifact.sh --result "benchmark-results/$preset/$scenario.json"
            done
          done

      - name: Stop headless Wayland compositor
        if: always() && steps.gate.outputs.run == 'true'
        uses: ./.github/actions/stop-weston

      - name: Reject Vulkan validation errors in benchmark log
        id: validate_vulkan
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/check_vulkan_log.sh benchmark.log

      - name: Require complete benchmark acceptance
        id: acceptance
        if: always() && steps.gate.outputs.run == 'true'
        env:
          RUN: ${{ steps.run_benchmark.outcome }}
          RESULTS: ${{ steps.validate_results.outcome }}
          VULKAN: ${{ steps.validate_vulkan.outcome }}
        run: |
          if [[ "$RUN" != success || "$RESULTS" != success || "$VULKAN" != success ]]; then
            echo "::error::Benchmark acceptance failed: run=$RUN results=$RESULTS vulkan=$VULKAN"
            exit 1
          fi

      - name: Install Bencher CLI
        if: github.event_name != 'pull_request' && steps.acceptance.outcome == 'success' && env.BENCHER_ENABLED == 'true'
        uses: bencherdev/bencher@30a740a2e4246560b1a5fd424057d84aa2b188d6

      - name: Publish Bencher trends
        if: github.event_name != 'pull_request' && steps.acceptance.outcome == 'success' && env.BENCHER_ENABLED == 'true'
        env:
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
          BENCHER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for preset in low medium high; do for scenario in stationary traversal rapid-turn teleport-eviction; do
            bencher run \
              --project "$BENCHER_PROJECT" \
              --branch "$BENCHER_BRANCH" \
              --testbed "github-actions-lavapipe" \
              --token "$BENCHER_API_TOKEN" \
              --adapter json \
              --err \
              "cat benchmark-results/${preset}/${scenario}.json"
          done; done

      - name: Comment Bencher dashboard
        if: steps.acceptance.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && env.BENCHER_DASHBOARD_URL != ''
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `Benchmark trends: ${process.env.BENCHER_DASHBOARD_URL}`,
            });

      - name: Upload benchmark artifacts
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmark-results
            benchmark.log
            weston.log
          retention-days: 30

      - name: Publish commit status
        if: always() && steps.gate.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/github-script@v9
        env:
          BENCHMARK_ACCEPTANCE: ${{ steps.acceptance.outcome }}
          BENCHMARK_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const failed = process.env.BENCHMARK_ACCEPTANCE !== 'success' || process.env.BENCHMARK_JOB_STATUS !== 'success';
            const description = failed
              ? 'Benchmark acceptance or publication failed'
              : 'Benchmark runtime, artifacts and Vulkan checks passed';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request?.head.sha || context.sha,
              state: failed ? 'failure' : 'success',
              context: 'performance/benchmark',
              description,
            });
