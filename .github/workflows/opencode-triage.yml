name: Issue Triage
on:
  issues:
    types: [opened]

permissions: {}
concurrency:
  group: opencode-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    cache-mode: none
    if: >-
      vars.OPENCODE_V2_TRIAGE_ENABLED == 'true' &&
      github.repository == 'OpenStaticFish/ZigCraft' &&
      github.event.repository.default_branch == 'dev' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/opencode-v2-infer.yml
    with:
      task: triage
