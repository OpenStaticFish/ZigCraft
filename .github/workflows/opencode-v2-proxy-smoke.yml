name: OpenCode V2 proxy smoke
on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: opencode-v2-proxy-smoke
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'OpenStaticFish/ZigCraft' &&
      github.event.repository.default_branch == 'dev' &&
      github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      artifact: ${{ steps.request.outputs.name }}
    steps:
      - name: Prepare fixed request
        id: request
        run: |
          echo 'Reply with exactly ZIGCRAFT_PROXY_OK and no other text.' > "$RUNNER_TEMP/request.txt"
          echo "name=smoke-request-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.request.outputs.name }}
          path: ${{ runner.temp }}/request.txt
          if-no-files-found: error
          retention-days: 1
  infer:
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/opencode-v2-infer.yml
    with:
      profile: default
      request-artifact: ${{ needs.prepare.outputs.artifact }}
  verify:
    needs: infer
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.infer.outputs.response-artifact }}
          path: ${{ runner.temp }}/smoke
      - name: Require exact model response
        run: printf '%s' 'ZIGCRAFT_PROXY_OK' | cmp -s - "$RUNNER_TEMP/smoke/response.txt"
