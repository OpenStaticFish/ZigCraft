name: opencode-audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      module:
        description: "Audit module (e.g. engine/graphics); blank uses rotation"
        type: string

permissions: {}
concurrency:
  group: opencode-v2-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      vars.OPENCODE_AUDIT_ENABLED == 'true' &&
      github.repository == 'OpenStaticFish/ZigCraft' && github.ref == 'refs/heads/dev' &&
      github.event.repository.default_branch == 'dev'
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/opencode-v2-infer.yml
    with:
      task: audit
