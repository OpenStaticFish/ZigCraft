name: opencode

on:
  pull_request_target:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number
      head_sha:
        description: Exact head SHA of the PR to review
        required: true
        type: string

permissions: {}
concurrency:
  group: opencode-gate-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  bind:
    if: >-
      github.repository == 'OpenStaticFish/ZigCraft' &&
      github.event.repository.default_branch == 'dev' && github.ref == 'refs/heads/dev' &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash scripts/opencode_review.sh pending
        env:
          GH_TOKEN: ${{ github.token }}

  review:
    needs: bind
    permissions:
      contents: read
      issues: read
      pull-requests: write
      statuses: write
      id-token: write
    uses: ./.github/workflows/opencode-v2-infer.yml
    with:
      task: review

  # Covers failures before the runner starts the script, including on a retry.
  failed:
    if: failure() && needs.bind.result == 'success'
    needs: [bind, review]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash scripts/opencode_review.sh failed
        env:
          GH_TOKEN: ${{ github.token }}
