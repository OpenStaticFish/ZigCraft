name: visual-test

on:
  schedule:
    - cron: "43 4 * * 2"
  pull_request:
    branches: [dev]
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-test:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-visual-test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv

      - name: Start headless Wayland compositor
        uses: ./.github/actions/start-weston

      - name: Allocate fresh capture directory
        run: |
          capture_dir=$(mktemp -d "$RUNNER_TEMP/visual-capture.XXXXXX")
          echo "VISUAL_CAPTURE_DIR=$capture_dir" >> "$GITHUB_ENV"

      - name: Setup Lavapipe Vulkan
        uses: ./.github/actions/setup-lavapipe

      - name: Run menu screenshot capture
        id: screenshot
        continue-on-error: true
        uses: ./.github/actions/run-with-log
        with:
          name: Visual Test
          timeout: 20m
          log-file: build-output.log
          command: devenv shell --profile graphics -- zig build run -Dscreenshot-path="$VISUAL_CAPTURE_DIR/screenshot.png" -Dskip-present=true
        env:
          ZIG_GLOBAL_CACHE_DIR: /tmp/zig-cache-global
          XDG_RUNTIME_DIR: /tmp/runtime-runner
          WAYLAND_DISPLAY: headless
          ZIGCRAFT_SMOKE_FRAMES: "5"
          ZIGCRAFT_SAFE_RENDER: "1"

      - name: Require fresh nonempty screenshot
        id: check_screenshot
        if: always()
        run: |
          if [ -n "${VISUAL_CAPTURE_DIR:-}" ] && [ -s "$VISUAL_CAPTURE_DIR/screenshot.png" ] && [ ! -L "$VISUAL_CAPTURE_DIR/screenshot.png" ]; then
            echo "screenshot_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "screenshot_exists=false" >> "$GITHUB_OUTPUT"
            echo "::error::Capture did not produce a fresh nonempty screenshot"
            exit 1
          fi

      - name: Compare against golden image
        id: golden_diff
        if: always() && steps.screenshot.outcome == 'success' && steps.check_screenshot.outcome == 'success'
        run: |
          timeout --kill-after=10s 3m nix shell github:NixOS/nixpkgs/42f17a57f4f6e33b3de3dca0a2a5ea5233169d02#imagemagick -c bash scripts/compare_visual_golden.sh "$VISUAL_CAPTURE_DIR/screenshot.png" docs/visual-test/golden/menu.png "$VISUAL_CAPTURE_DIR/visual-diff.png"
        env:
          VISUAL_DIFF_RMSE_TOLERANCE: "0.015"

      - name: Upload screenshot artifact
        if: always() && steps.check_screenshot.outputs.screenshot_exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: menu-screenshot
          path: |
            ${{ env.VISUAL_CAPTURE_DIR }}/screenshot.png
            ${{ env.VISUAL_CAPTURE_DIR }}/visual-diff.png
          if-no-files-found: error
          retention-days: 30

      - name: Check build log exists
        id: check_log
        if: always()
        run: 'test -f build-output.log && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"'

      - name: Upload build log artifact
        if: always() && steps.check_log.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-output-log
          path: |
            build-output.log
            weston.log
          retention-days: 7

      - name: Stop headless Wayland compositor
        if: always()
        uses: ./.github/actions/stop-weston

      - name: Require complete visual acceptance
        if: always()
        env:
          CAPTURE: ${{ steps.screenshot.outcome }}
          IMAGE: ${{ steps.check_screenshot.outcome }}
          COMPARISON: ${{ steps.golden_diff.outcome }}
        run: |
          if [[ "$CAPTURE" != success || "$IMAGE" != success || "$COMPARISON" != success ]]; then
            echo "::error::Visual acceptance failed: capture=$CAPTURE image=$IMAGE comparison=$COMPARISON"
            exit 1
          fi
