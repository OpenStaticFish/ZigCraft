name: visual-test

on:
  schedule:
    - cron: "43 4 * * *"
  pull_request:
    branches: [dev]
    types: [labeled]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'run-visual-test') ||
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id && format('visual-evidence-{0}-{1}', github.run_id, github.run_attempt) }}
    steps:
      - name: Prepare evidence directory
        run: mkdir "$RUNNER_TEMP/visual-evidence"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
      - uses: ./.github/actions/start-weston
        with:
          log-file: ${{ runner.temp }}/visual-evidence/weston.log
      - uses: ./.github/actions/setup-lavapipe

      - name: Capture menu screenshot
        id: capture
        uses: ./.github/actions/run-with-log
        with:
          name: Visual Test
          timeout: 20m
          log-file: ${{ runner.temp }}/visual-evidence/build-output.log
          command: devenv shell --profile graphics -- zig build run -Dscreenshot-path="$RUNNER_TEMP/visual-evidence/screenshot.png" -Dskip-present=true
        env:
          ZIG_GLOBAL_CACHE_DIR: /tmp/zig-cache-global
          ZIGCRAFT_SMOKE_FRAMES: "5"
          ZIGCRAFT_SAFE_RENDER: "1"

      - name: Compare against golden image
        id: compare
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/visual-evidence"
          nix shell nixpkgs#imagemagick -c bash scripts/compare_visual_golden.sh \
            "$evidence/screenshot.png" docs/visual-test/golden/menu.png "$evidence/visual-diff.png" \
            2>&1 | tee "$evidence/comparison.log"
        env:
          VISUAL_DIFF_RMSE_TOLERANCE: "0.015"
      - name: Stop headless Wayland compositor
        if: always()
        uses: ./.github/actions/stop-weston
      - name: Record capture and comparison outcomes
        if: ${{ !cancelled() }}
        env:
          CAPTURE: ${{ steps.capture.outcome }}
          COMPARISON: ${{ steps.compare.outcome }}
        run: |
          printf 'Menu capture: %s\nGolden comparison: %s\n' "$CAPTURE" "$COMPARISON" \
            > "$RUNNER_TEMP/visual-evidence/outcomes.txt"
      - name: Upload visual evidence
        id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-evidence/
          retention-days: 30
          if-no-files-found: error

  infer:
    needs: prepare
    if: >-
      !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'failure') &&
      needs.prepare.outputs.artifact != '' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      github.repository == 'OpenStaticFish/ZigCraft' && github.ref == 'refs/heads/dev' &&
      github.event.repository.default_branch == 'dev' && vars.OPENCODE_VISUAL_ENABLED == 'true'
    uses: ./.github/workflows/opencode-v2-infer.yml
    permissions:
      contents: read
      issues: write
      id-token: write
    with:
      task: visual
      visual-artifact: ${{ needs.prepare.outputs.artifact }}
      capture-result: ${{ needs.prepare.result }}
