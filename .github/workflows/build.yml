name: Build

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to build/test"
        required: true
        type: string
      enable_platform_builds:
        description: "Run experimental Windows/macOS build-only jobs"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      code_changes: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.base_ref == 'main' || steps.filter.outputs.code_changes }}
      platform_changes: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.platform_changes }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'

      - name: Detect build-relevant changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code_changes:
              - 'src/**'
              - 'modules/**'
              - 'libs/**'
              - 'assets/shaders/**'
              - 'scripts/**'
              - 'docs/benchmarks/**'
              - 'docs/shaders/**'
              - 'build.zig'
              - 'build.zig.zon'
              - 'devenv.nix'
              - 'devenv.yaml'
              - 'devenv.lock'
              - '.github/actions/**'
              - '.github/vulkan/**'
              - '.github/workflows/build.yml'
              - '.github/workflows/benchmark.yml'
            platform_changes:
              - 'src/**'
              - 'modules/**'
              - 'build.zig'
              - 'build.zig.zon'

  fmt:
    permissions:
      contents: read
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv

      - name: Check Zig formatting
        run: devenv shell --profile unit -- zig fmt --check src/ modules/ build.zig

  build:
    permissions:
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: [changes, fmt]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Skip build for workflow-only changes
        if: needs.changes.outputs.code_changes != 'true'
        run: |
          echo "No build-relevant changes detected. Skipping binary build."

      - name: Setup devenv
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/setup-devenv

      - name: Build
        if: needs.changes.outputs.code_changes == 'true'
        run: devenv shell --profile unit -- devenv tasks run zigcraft:build

      - name: Prepare Artifact
        if: needs.changes.outputs.code_changes == 'true'
        run: |
          mkdir -p dist
          cp -L dist/bin/zigcraft dist/zigcraft-linux

      - name: Upload Artifact
        if: needs.changes.outputs.code_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zigcraft
          path: dist/zigcraft-linux
          retention-days: 7

  unit-test-matrix:
    permissions:
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: [changes, build]
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Skip unit tests for workflow-only changes
        if: needs.changes.outputs.code_changes != 'true'
        run: |
          echo "No build-relevant changes detected. Skipping unit tests."

      - name: Setup devenv
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/setup-devenv

      - name: Setup Zig cache
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/setup-zig-cache
        with:
          cache-key-prefix: zig-ci-unit-${{ matrix.optimize }}

      - name: Run unit tests (${{ matrix.optimize }})
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/run-with-log
        with:
          name: Unit Test (${{ matrix.optimize }})
          timeout: 25m
          log-file: unit-test-${{ matrix.optimize }}.log
          command: devenv shell --profile unit -- zig build -Doptimize=${{ matrix.optimize }} test

      - name: Upload unit test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-log-${{ matrix.optimize }}
          path: unit-test-${{ matrix.optimize }}.log
          if-no-files-found: ignore
          retention-days: 7

  unit-test:
    permissions:
      contents: read
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    needs: [unit-test-matrix]
    if: always()
    steps:
      - name: Require unit test matrix success
        run: |
          if [ "${{ needs.unit-test-matrix.result }}" != "success" ]; then
            echo "Unit test matrix result: ${{ needs.unit-test-matrix.result }}" >&2
            exit 1
          fi
          echo "Unit test matrix passed."

  integration-test:
    permissions:
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 75
    needs: [changes, unit-test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Skip integration tests for workflow-only changes
        if: needs.changes.outputs.code_changes != 'true'
        run: |
          echo "No build-relevant changes detected. Skipping integration tests."

      - name: Setup devenv
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/setup-devenv

      - name: Setup Zig cache
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/setup-zig-cache
        with:
          cache-key-prefix: zig-ci-graphics

      - name: Start headless Wayland compositor
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/start-weston

      - name: Setup Lavapipe Vulkan validation
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/setup-lavapipe

      - name: Run integration smoke test
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/run-with-log
        with:
          name: Integration Test
          timeout: 25m
          log-file: integration-test.log
          command: devenv shell --profile graphics -- zig build test-integration -Dskip-present=true

      - name: Run world load smoke test (headless)
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/run-with-log
        with:
          name: World Smoke Test
          timeout: 15m
          log-file: world-smoke-test.log
          command: devenv shell --profile graphics -- zig build run -Dsmoke-test=true -Dskip-present=true
        env:
          XDG_RUNTIME_DIR: /tmp/runtime-runner
          WAYLAND_DISPLAY: headless
          ZIGCRAFT_SMOKE_FRAMES: "3"
          ZIGCRAFT_SAFE_MODE: "1"

      - name: Fail on Vulkan validation log errors
        if: needs.changes.outputs.code_changes == 'true'
        run: bash scripts/check_vulkan_log.sh integration-test.log world-smoke-test.log

      - name: Run present-enabled Lavapipe smoke test
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/run-with-log
        with:
          name: Present Smoke Test
          timeout: 10m
          log-file: present-smoke-test.log
          command: devenv shell --profile graphics -- zig build run -Dsmoke-test=true -Dskip-present=false -Dauto-world=test
        env:
          ZIGCRAFT_SMOKE_FRAMES: "3"
          ZIGCRAFT_SAFE_MODE: "1"
          SDL_VIDEODRIVER: wayland

      - name: Validate present-enabled smoke log
        if: needs.changes.outputs.code_changes == 'true'
        run: bash scripts/check_vulkan_log.sh present-smoke-test.log

      - name: Stop headless Wayland compositor
        if: always() && needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/stop-weston

      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs
          path: |
            integration-test.log
            world-smoke-test.log
            present-smoke-test.log
            weston.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload minidumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-minidumps
          path: zigcraft-minidumps/**/*.dmp
          if-no-files-found: ignore
          retention-days: 14

  platform-build:
    permissions:
      contents: read
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' && inputs.enable_platform_builds == true && needs.changes.outputs.platform_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: zigcraft-windows
            binary_path: zig-out/bin/zigcraft.exe
          - os: macos-latest
            artifact_name: zigcraft-macos-build-only
            binary_path: zig-out/bin/zigcraft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true

      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows'
        run: choco install vulkan-sdk --no-progress -y

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: pacman --noconfirm -S --needed mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-vulkan-loader mingw-w64-ucrt-x86_64-vulkan-headers

      - name: Expose Windows Vulkan import library
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          if [ -f /ucrt64/lib/libvulkan.dll.a ] && [ ! -f /ucrt64/lib/libvulkan.a ]; then
            cp /ucrt64/lib/libvulkan.dll.a /ucrt64/lib/libvulkan.a
          fi

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install sdl3 molten-vk vulkan-loader

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CPATH: /ucrt64/include
          LIBRARY_PATH: /ucrt64/lib
        run: zig build --search-prefix /ucrt64 -Dimgui=false

      - name: Build macOS
        if: runner.os == 'macOS'
        run: zig build -Dimgui=false

      - name: Upload platform binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
          retention-days: 7
