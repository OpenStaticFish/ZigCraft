name: Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to build/test"
        required: true
        type: string
      enable_platform_builds:
        description: "Run experimental Windows/macOS build-only jobs"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.filter.outputs.game }}
      fmt: ${{ steps.filter.outputs.fmt }}
      graphics: ${{ steps.filter.outputs.graphics }}
      shaders: ${{ steps.filter.outputs.shaders }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          sparse-checkout: scripts

      - name: Select checks for the full diff
        id: filter
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$BASE" =~ ^0+$ ]]; then
            python3 scripts/ci_changes.py --all </dev/null >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              BASE=$(git merge-base "$BASE" "$HEAD")
            fi
            git diff --name-only --no-renames -z "$BASE" "$HEAD" |
              python3 scripts/ci_changes.py >> "$GITHUB_OUTPUT"
          fi

  fmt:
    needs: changes
    if: needs.changes.outputs.fmt == 'true'
    permissions:
      contents: read
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv

      - name: Check Zig formatting
        run: devenv shell --profile unit -- zig fmt --check src/ modules/

  compile:
    needs: changes
    if: needs.changes.outputs.game == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv

      - name: Build
        run: devenv shell --profile unit -- devenv tasks run zigcraft:build

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          cp -L dist/bin/zigcraft dist/zigcraft-linux

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zigcraft
          path: dist/zigcraft-linux
          retention-days: 7

  build:
    needs: [changes, fmt, compile]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify selected build checks
        env:
          CHANGES: ${{ needs.changes.result }}
          FMT: ${{ needs.changes.outputs.fmt }}:${{ needs.fmt.result }}
          COMPILE: ${{ needs.changes.outputs.game }}:${{ needs.compile.result }}
        run: |
          test "$CHANGES" = success
          for check in "$FMT" "$COMPILE"; do
            case "$check" in true:success|false:skipped) ;; *) echo "Unexpected build result $check"; exit 1 ;; esac
          done

  unit-test-matrix:
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.game == 'true' }}
    permissions:
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: [changes, build]
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv

      - name: Setup Zig cache
        uses: ./.github/actions/setup-zig-cache
        with:
          cache-key-prefix: zig-ci-unit-${{ matrix.optimize }}

      - name: Run unit tests (${{ matrix.optimize }})
        uses: ./.github/actions/run-with-log
        with:
          name: Unit Test (${{ matrix.optimize }})
          timeout: 25m
          log-file: unit-test-${{ matrix.optimize }}.log
          command: devenv shell --profile unit -- zig build -Doptimize=${{ matrix.optimize }} test

      - name: Upload unit test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-log-${{ matrix.optimize }}
          path: unit-test-${{ matrix.optimize }}.log
          if-no-files-found: ignore
          retention-days: 7

  shader-validation:
    needs: changes
    if: needs.changes.outputs.shaders == 'true'
    permissions:
      contents: read
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-devenv
      - run: devenv shell --profile unit -- bash scripts/check_spirv_sizes.sh
      - run: devenv shell --profile unit -- bash scripts/check_shadow_abi.sh

  unit-test:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [changes, build, unit-test-matrix, shader-validation]
    if: always()
    steps:
      - name: Verify selected test checks
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          MATRIX: ${{ needs.changes.outputs.game }}:${{ needs.unit-test-matrix.result }}
          SHADERS: ${{ needs.changes.outputs.shaders }}:${{ needs.shader-validation.result }}
        run: |
          test "$CHANGES" = success
          test "$BUILD" = success
          for check in "$MATRIX" "$SHADERS"; do
            case "$check" in true:success|false:skipped) ;; *) echo "Unexpected test result $check"; exit 1 ;; esac
          done

  coverage:
    needs: changes
    if: needs.changes.outputs.game == 'true'
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/coverage.yml
    with:
      ref: ${{ inputs.ref || '' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-test:
    if: ${{ !cancelled() && needs.unit-test.result == 'success' && needs.changes.outputs.graphics == 'true' }}
    permissions:
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 75
    needs: [changes, unit-test]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv

      - name: Setup Zig cache
        uses: ./.github/actions/setup-zig-cache
        with:
          cache-key-prefix: zig-ci-graphics

      - name: Start headless Wayland compositor
        uses: ./.github/actions/start-weston

      - name: Setup Lavapipe Vulkan validation
        uses: ./.github/actions/setup-lavapipe

      - name: Run integration smoke test
        uses: ./.github/actions/run-with-log
        with:
          name: Integration Test
          timeout: 25m
          log-file: integration-test.log
          command: devenv shell --profile graphics -- zig build test-integration -Dskip-present=true

      - name: Run world load smoke test (headless)
        uses: ./.github/actions/run-with-log
        with:
          name: World Smoke Test
          timeout: 15m
          log-file: world-smoke-test.log
          command: devenv shell --profile graphics -- zig build run -Dsmoke-test=true -Dskip-present=true
        env:
          XDG_RUNTIME_DIR: /tmp/runtime-runner
          WAYLAND_DISPLAY: headless
          ZIGCRAFT_SMOKE_FRAMES: "3"
          ZIGCRAFT_SAFE_MODE: "1"

      - name: Fail on Vulkan validation log errors
        run: |
          set -euo pipefail
          if rg -n -e 'Vulkan validation error|Validation Error:|VUID-' integration-test.log world-smoke-test.log; then
            echo "Vulkan validation errors were found in integration logs." >&2
            exit 1
          fi
          echo "No Vulkan validation errors found in integration logs."

      - name: Stop headless Wayland compositor
        if: always()
        uses: ./.github/actions/stop-weston

      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs
          path: |
            integration-test.log
            world-smoke-test.log
            weston.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload minidumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-minidumps
          path: zigcraft-minidumps/**/*.dmp
          if-no-files-found: ignore
          retention-days: 14

  platform-build:
    permissions:
      contents: read
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' && inputs.enable_platform_builds
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: zigcraft-windows
            binary_path: zig-out/bin/zigcraft.exe
          - os: macos-latest
            artifact_name: zigcraft-macos-build-only
            binary_path: zig-out/bin/zigcraft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true

      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows'
        run: choco install vulkan-sdk --no-progress -y

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: pacman --noconfirm -S --needed mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-vulkan-loader mingw-w64-ucrt-x86_64-vulkan-headers

      - name: Expose Windows Vulkan import library
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          if [ -f /ucrt64/lib/libvulkan.dll.a ] && [ ! -f /ucrt64/lib/libvulkan.a ]; then
            cp /ucrt64/lib/libvulkan.dll.a /ucrt64/lib/libvulkan.a
          fi

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install sdl3 molten-vk vulkan-loader

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CPATH: /ucrt64/include
          LIBRARY_PATH: /ucrt64/lib
        run: zig build --search-prefix /ucrt64 -Dimgui=false

      - name: Build macOS
        if: runner.os == 'macOS'
        run: zig build -Dimgui=false

      - name: Upload platform binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
          retention-days: 7
