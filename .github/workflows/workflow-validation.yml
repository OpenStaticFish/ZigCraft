name: Workflow Validation

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/*.sh"
      - "scripts/*.py"
      - ".shellcheckrc"
      - "devenv.nix"
      - "devenv.yaml"
      - "devenv.lock"
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/*.sh"
      - "scripts/*.py"
      - ".shellcheckrc"
      - "devenv.nix"
      - "devenv.yaml"
      - "devenv.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  yaml-parse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv

      - name: Parse workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |f| YAML.load_file(f); puts "OK #{f}" }'

      - name: Parse composite action YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/actions/**/action.{yml,yaml}"].sort.each { |f| YAML.load_file(f); puts "OK #{f}" }'

      - name: Check shell script syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Run ShellCheck
        run: devenv shell --profile unit -- shellcheck scripts/*.sh

      - name: Verify offline CI acceptance regressions
        run: python3 -B scripts/test_ci_verification.py

      - name: Validate devenv configuration
        run: devenv info >/dev/null
