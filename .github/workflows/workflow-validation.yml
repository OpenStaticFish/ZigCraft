name: Workflow Validation

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/opencode/**"
      - "scripts/*.sh"
      - "scripts/*.py"
      - ".github/prompts/**"
      - ".shellcheckrc"
      - "devenv.nix"
      - "devenv.yaml"
      - "devenv.lock"
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/opencode/**"
      - "scripts/*.sh"
      - "scripts/*.py"
      - ".github/prompts/**"
      - ".shellcheckrc"
      - "devenv.nix"
      - "devenv.yaml"
      - "devenv.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  yaml-parse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv

      - name: Parse workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |f| YAML.load_file(f); puts "OK #{f}" }'

      - name: Parse composite action YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/actions/**/action.{yml,yaml}"].sort.each { |f| YAML.load_file(f); puts "OK #{f}" }'

      - name: Check OpenCode provider config
        run: jq -e '.providers.zigcraft.models[.model | split("/")[1]] != null' .github/opencode/provider.json

      - name: Check shell script syntax
        run: devenv shell --profile unit -- bash -n scripts/*.sh

      - name: Run ShellCheck
        run: devenv shell --profile unit -- shellcheck scripts/*.sh

      - name: Test OpenCode discussion formatting
        run: python3 scripts/test_opencode_discussion_markdown.py

      - name: Validate devenv configuration
        run: devenv info >/dev/null
