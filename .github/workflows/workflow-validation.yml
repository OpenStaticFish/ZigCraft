name: Workflow Validation

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/*.sh"
      - "scripts/*.py"
      - "scripts/tests/**"
      - ".github/prompts/**"
      - ".shellcheckrc"
      - "devenv.nix"
      - "devenv.yaml"
      - "devenv.lock"
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/*.sh"
      - "scripts/*.py"
      - "scripts/tests/**"
      - ".github/prompts/**"
      - ".shellcheckrc"
      - "devenv.nix"
      - "devenv.yaml"
      - "devenv.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-fetch-smoke:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: scripts/opencode_*.py
          sparse-checkout-cone-mode: false
      - name: Verify the pinned patch against PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I scripts/opencode_pr_gate.py smoke

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  yaml-parse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv

      - name: Parse workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |f| YAML.load_file(f); puts "OK #{f}" }'

      - name: Parse composite action YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/actions/**/action.{yml,yaml}"].sort.each { |f| YAML.load_file(f); puts "OK #{f}" }'

      - name: Check OpenCode caller and adapter contracts (offline)
        run: python3 -B -m unittest discover -s scripts/tests

      - name: Verify synthetic OpenCode reports with GitHub Markdown
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_TEST_GITHUB_RENDER: "1"
        run: python3 -B -m unittest discover -s scripts/tests -k gfm

      - name: Check shell script syntax
        run: devenv shell --profile unit -- bash -n scripts/*.sh

      - name: Run ShellCheck
        run: devenv shell --profile unit -- shellcheck scripts/*.sh

      - name: Validate devenv configuration
        run: devenv info >/dev/null
