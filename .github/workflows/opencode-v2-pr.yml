name: OpenCode V2 PR pilot

on:
  # Dispatch is always shadow-only, even after advisory publication is enabled.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR targeting dev
        type: number
        required: true
      base_sha:
        description: Exact 40-character PR base SHA
        type: string
        required: true
      head_sha:
        description: Exact 40-character PR head SHA
        type: string
        required: true
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: opencode-v2-pr-${{ github.event_name }}-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
  BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}

jobs:
  prepare:
    if: >-
      github.repository == 'OpenStaticFish/ZigCraft' &&
      github.event.repository.default_branch == 'dev' && github.ref == 'refs/heads/dev' &&
      github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
      ((github.event_name == 'workflow_dispatch' && vars.OPENCODE_V2_PR_SHADOW_ENABLED == 'true') ||
       (github.event_name == 'pull_request_target' && vars.OPENCODE_V2_PR_ADVISORY_ENABLED == 'true' &&
        !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      request: ${{ steps.prepare.outputs.request }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/opencode_v2_pr.py
          sparse-checkout-cone-mode: false
      - name: Authorize actor and collect pinned diff
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/opencode_v2_pr.py prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.prepare.outputs.request != ''
        with:
          name: ${{ steps.prepare.outputs.request }}
          path: ${{ runner.temp }}/pr-input/request.txt
          if-no-files-found: error
          retention-days: 1

  infer:
    cache-mode: none
    needs: prepare
    if: needs.prepare.outputs.request != ''
    permissions:
      contents: read
    uses: ./.github/workflows/opencode-v2-infer.yml
    with:
      profile: review
      request-artifact: ${{ needs.prepare.outputs.request }}

  shadow:
    needs: infer
    if: github.event_name == 'workflow_dispatch' && vars.OPENCODE_V2_PR_SHADOW_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/opencode_v2_pr.py
          sparse-checkout-cone-mode: false
      - name: Require the current run's inference output
        env:
          RESPONSE_ARTIFACT: ${{ needs.infer.outputs.response-artifact }}
        run: test -n "$RESPONSE_ARTIFACT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.infer.outputs.response-artifact }}
          path: ${{ runner.temp }}/pr-output
      - name: Summarize advisory findings for exact revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/opencode_v2_pr.py shadow

  publish:
    needs: infer
    if: github.event_name == 'pull_request_target' && vars.OPENCODE_V2_PR_ADVISORY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/opencode_v2_pr.py
          sparse-checkout-cone-mode: false
      - name: Require the current run's inference output
        env:
          RESPONSE_ARTIFACT: ${{ needs.infer.outputs.response-artifact }}
        run: test -n "$RESPONSE_ARTIFACT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.infer.outputs.response-artifact }}
          path: ${{ runner.temp }}/pr-output
      - name: Publish one advisory comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/opencode_v2_pr.py publish
