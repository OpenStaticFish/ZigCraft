name: opencode-test-writer

on:
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:
    inputs:
      module:
        description: "Test module (e.g. graphics/vulkan-device); blank uses rotation"
        type: string

permissions: {}
concurrency:
  group: opencode-v2-test-writer
  cancel-in-progress: false

jobs:
  write:
    if: >-
      vars.OPENCODE_TEST_WRITER_ENABLED == 'true' &&
      github.repository == 'OpenStaticFish/ZigCraft' && github.ref == 'refs/heads/dev' &&
      github.event.repository.default_branch == 'dev'
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/opencode-v2-infer.yml
    with:
      task: test-writer

  validate:
    needs: write
    if: needs.write.outputs.tests-artifact != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    outputs:
      tree: ${{ steps.apply.outputs.tree }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.write.outputs.tests-artifact }}
          path: ${{ runner.temp }}/proposal
      - id: apply
        run: bash scripts/apply_generated_tests.sh
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Validate proposed Zig in an isolated unit devenv
        run: |
          revision=$(jq -er '.nodes.nixpkgs.locked.rev' devenv.lock)
          nix profile add "github:NixOS/nixpkgs/$revision#devenv"
          devenv shell --profile unit -- bash scripts/validate_generated_zig.sh

  publish:
    needs: [write, validate]
    if: needs.validate.outputs.tree != '' && vars.OPENCODE_TEST_WRITER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.write.outputs.tests-artifact }}
          path: ${{ runner.temp }}/proposal
      - id: apply
        run: bash scripts/apply_generated_tests.sh
      - id: existing
        env:
          VALIDATED_TREE: ${{ needs.validate.outputs.tree }}
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: dev
        run: |
          [[ "$(GIT_INDEX_FILE="$RUNNER_TEMP/opencode-test-index" git write-tree)" == "$VALIDATED_TREE" ]]
          bash scripts/authorize_source_task.sh
          bash scripts/check_existing_test_prs.sh
      - if: steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          MODULE: ${{ steps.apply.outputs.module }}
        run: bash scripts/publish_generated_tests.sh
